<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 背景漸層：沈穩暖黑棕 -->
    <linearGradient id="bgGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2d2421" />
      <stop offset="100%" stop-color="#181311" />
    </linearGradient>

    <!-- 主圖標漸層：琥珀金 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- 圓角方形底座 -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" />

  <!-- 圓環底座/背景軌道 -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#fffdf6" stroke-width="8" opacity="0.15" />

  <!-- 非對稱比例圓環 (用 stroke-dasharray 切割成不等比例，圓心絕對精準在 32, 32)
       圓周長約 100.5，這裡設定 65% 琥珀金 + 35% 米白空間 -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="8" 
          stroke-dasharray="65 35.5" stroke-dashoffset="25" />

  <!-- 另一個輔助環或區塊，用米白色呈現剩餘比例 -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#fffdf6" stroke-width="8" 
          stroke-dasharray="32 68.5" stroke-dashoffset="-40" opacity="0.95" />

  <!-- 絕對置中的中心結算點 -->
  <circle cx="32" cy="32" r="5" fill="#181311" />
  <circle cx="32" cy="32" r="2" fill="#fffdf6" />

</svg>
